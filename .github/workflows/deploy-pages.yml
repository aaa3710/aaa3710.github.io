name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.PUBLIC_SUPPORT_EMAIL }}
      NEXT_PUBLIC_APP_FEEDBACK_READY: ${{ vars.APP_FEEDBACK_READY }}
      NEXT_PUBLIC_CONTACT_READY: ${{ vars.CONTACT_READY }}
      NEXT_PUBLIC_LOCATION_LOGGER_FEEDBACK_READY: ${{ vars.LOCATION_LOGGER_FEEDBACK_READY }}
      NEXT_PUBLIC_LOCATION_LOGGER_FEEDBACK_URL_JA: ${{ vars.LOCATION_LOGGER_FEEDBACK_URL_JA }}
      NEXT_PUBLIC_LOCATION_LOGGER_FEEDBACK_URL_EN: ${{ vars.LOCATION_LOGGER_FEEDBACK_URL_EN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure deployment paths
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository" != "$owner.github.io" ]]; then
            echo "This site is configured for the GitHub user-site repository: $owner.github.io" >&2
            exit 1
          fi
          echo "GITHUB_PAGES=true" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_ORIGIN=https://$owner.github.io" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: |
          npm run format -- --check
          npm run lint
          npm test

      - name: Copy verified WordPress snapshot
        run: npm run build:pages

      - name: Verify generated pages
        run: npm run verify:pages

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
